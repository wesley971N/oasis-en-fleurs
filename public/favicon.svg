<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Les Naturels de la Source">
  <!-- Fond vert forêt (même vert que la pastille du logo) -->
  <circle cx="32" cy="32" r="32" fill="#1C4A3A"/>
  <!-- 6 pétales dorés -->
  <g fill="#C9A06A">
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5"/>
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5" transform="rotate(120 32 32)"/>
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5" transform="rotate(180 32 32)"/>
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5" transform="rotate(240 32 32)"/>
    <ellipse cx="32" cy="18.5" rx="7.2" ry="11.5" transform="rotate(300 32 32)"/>
  </g>
  <!-- Cœur crème -->
  <circle cx="32" cy="32" r="6.4" fill="#F4EDDC"/>
</svg>
